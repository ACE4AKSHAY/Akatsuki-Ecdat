name: 'ECDAT Cryptographic Discovery'
description: >
  Scan a repository for cryptographic assets with ECDAT and upload a
  CycloneDX CBOM and a SARIF report. The scan runs headlessly against a
  throwaway database; it does not require the ECDAT server.
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  target:
    description: 'Path to scan, relative to the repository root'
    required: false
    default: '.'
  output-dir:
    description: 'Directory that receives cbom.json and results.sarif'
    required: false
    default: 'ecdat-results'
  fail-on-critical:
    description: "Fail the step when Critical-tier assets are found ('true'/'false')"
    required: false
    default: 'false'
  python-version:
    description: 'Python version used to run ECDAT'
    required: false
    default: '3.12'
  compliance-target:
    description: 'Policy target for recommendation ranking'
    required: false
    default: 'NIST-general'

outputs:
  asset-count:
    description: 'Number of cryptographic assets discovered'
    value: ${{ steps.scan.outputs.asset-count }}
  critical-count:
    description: 'Number of Critical-tier assets discovered'
    value: ${{ steps.scan.outputs.critical-count }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install ECDAT
      shell: bash
      run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    - name: Run headless discovery scan
      id: scan
      shell: bash
      env:
        ECDAT_TARGET: ${{ inputs.target }}
        ECDAT_OUTPUT_DIR: ${{ inputs.output-dir }}
        ECDAT_FAIL_ON_CRITICAL: ${{ inputs.fail-on-critical }}
        ECDAT_COMPLIANCE_TARGET: ${{ inputs.compliance-target }}
      run: |
        ARGS="--target \"$ECDAT_TARGET\" --output \"$ECDAT_OUTPUT_DIR\" --compliance-target \"$ECDAT_COMPLIANCE_TARGET\""
        if [ "$ECDAT_FAIL_ON_CRITICAL" = "true" ]; then
          ARGS="$ARGS --fail-on-critical"
        fi
        SUMMARY=$(eval python scripts/scan_cli.py $ARGS)
        echo "$SUMMARY"
        echo "asset-count=$(echo "$SUMMARY" | sed -n 's/^assets: \([0-9]*\).*/\1/p')" >> "$GITHUB_OUTPUT"
        echo "critical-count=$(echo "$SUMMARY" | sed -n 's/.*Critical.: \([0-9]*\).*/\1/p')" >> "$GITHUB_OUTPUT"
    - name: Upload discovery artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ecdat-discovery-results
        path: ${{ inputs.output-dir }}
        if-no-files-found: error
