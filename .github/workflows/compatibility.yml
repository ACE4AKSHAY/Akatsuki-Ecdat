name: Windows and Linux compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: project with spaces
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project with spaces
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Windows batch setup
        if: runner.os == 'Windows'
        shell: cmd
        run: ecdat.bat setup
      - name: Linux setup
        if: runner.os != 'Windows'
        run: python scripts/launcher.py setup
      - name: Windows batch tests and build
        if: runner.os == 'Windows'
        shell: cmd
        run: ecdat.bat test
      - name: Linux tests and build
        if: runner.os != 'Windows'
        run: python scripts/launcher.py test
      - name: Windows real process LAN smoke check
        if: runner.os == 'Windows'
        shell: cmd
        run: .venv\Scripts\python.exe tests\launcher_smoke.py
      - name: Linux real process LAN smoke check
        if: runner.os != 'Windows'
        run: .venv/bin/python tests/launcher_smoke.py
      - name: Save launcher logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-logs-${{ runner.os }}
          path: project with spaces/work/launcher-smoke.log
          if-no-files-found: ignore
