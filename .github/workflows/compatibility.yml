name: Windows and Linux compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: project with spaces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: project with spaces
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Windows batch setup
        if: runner.os == 'Windows'
        shell: cmd
        run: ecdat.bat setup
      - name: Linux setup
        if: runner.os != 'Windows'
        run: python scripts/launcher.py setup
      - name: Windows batch tests and build
        if: runner.os == 'Windows'
        shell: cmd
        run: ecdat.bat test
      - name: Linux tests and build
        if: runner.os != 'Windows'
        run: python scripts/launcher.py test
      - name: Windows real process LAN smoke check
        if: runner.os == 'Windows'
        shell: cmd
        run: .venv\Scripts\python.exe tests\launcher_smoke.py
      - name: Linux real process LAN smoke check
        if: runner.os != 'Windows'
        run: .venv/bin/python tests/launcher_smoke.py
      - name: Save launcher logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-logs-${{ runner.os }}
          path: project with spaces/work/launcher-smoke.log
          if-no-files-found: ignore
